name: Sync profile charts

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-chart-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate charts from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ukyamyam
        run: python scripts/generate_profile_charts.py

      - name: Commit refreshed charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if git diff --cached --quiet; then
            echo "Charts are already current."
            exit 0
          fi
          git commit -m "chore: sync profile charts"
          git push
